<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <pattern id="grid-proj-41" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.7"/>
    </pattern>
    <linearGradient id="hudGrad-proj-41" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="380" fill="#090d16"/>
  <rect width="600" height="380" fill="url(#grid-proj-41)"/>

  <!-- CAD Viewport Overlay Frames -->
  <rect x="20" y="20" width="560" height="340" fill="none" stroke="#1e293b" stroke-width="1"/>
  <rect x="25" y="25" width="550" height="330" fill="none" stroke="#334155" stroke-dasharray="4 4" stroke-width="0.8"/>

  <!-- Title Block (Top Left) -->
  <rect x="28" y="28" width="220" height="70" rx="3" fill="url(#hudGrad-proj-41)" stroke="#38bdf8" stroke-width="0.8" opacity="0.9"/>
  <text x="35" y="44" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="12" font-weight="bold" letter-spacing="1">PROJ-41 // SOLIDWORKS CAD</text>
  
        <text x="35" y="58" fill="#64748b" font-family="'Times New Roman', serif" font-size="10">DISCIPLINE:</text>
        <text x="110" y="58" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">Material Handling</text>
        
        <text x="35" y="72" fill="#64748b" font-family="'Times New Roman', serif" font-size="10">MATERIAL:</text>
        <text x="110" y="72" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">Carbon Steel A36 &amp; Hardox Flighting</text>
        
        <text x="35" y="86" fill="#64748b" font-family="'Times New Roman', serif" font-size="10">PITCH:</text>
        <text x="110" y="86" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">Constant Pitch Sectional Flights</text>
        
        <text x="35" y="100" fill="#64748b" font-family="'Times New Roman', serif" font-size="10">STATUS:</text>
        <text x="110" y="100" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">Volumetric Flow Approved</text>
        

  <!-- Viewport Orientation Cube (Top Right) -->
  <g transform="translate(520, 35)">
    <polygon points="20,0 40,10 20,20 0,10" fill="none" stroke="#38bdf8" stroke-width="1"/>
    <polygon points="0,10 20,20 20,40 0,30" fill="none" stroke="#0ea5e9" stroke-width="1"/>
    <polygon points="20,20 40,10 40,30 20,40" fill="none" stroke="#0284c7" stroke-width="1"/>
    <text x="17" y="13" fill="#f8fafc" font-family="'Times New Roman', serif" font-size="8">TOP</text>
    <text x="5" y="27" fill="#f8fafc" font-family="'Times New Roman', serif" font-size="8">FRONT</text>
    <text x="25" y="27" fill="#f8fafc" font-family="'Times New Roman', serif" font-size="8">RIGHT</text>
  </g>

  <!-- Central Engineering Geometry -->
  
  <g transform="translate(300, 200)">
    <!-- U-Shaped Outer Trough Body -->
    <path d="M -140 -35 L -140 30 C -140 60, 140 60, 140 30 L 140 -35" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <line x1="-145" y1="-35" x2="145" y2="-35" stroke="#f8fafc" stroke-width="1.8"/>

    <!-- Center Rotating Pipe Shaft -->
    <rect x="-135" y="-5" width="270" height="10" rx="2" fill="none" stroke="#f8fafc" stroke-width="2"/>

    <!-- Continuous Helical Auger Flighting (Spirals) -->
    <g stroke="#38bdf8" stroke-width="2.5" fill="none">
      <path d="M -120 30 C -105 10, -105 -10, -120 -30"/>
      <path d="M -70 30 C -55 10, -55 -10, -70 -30"/>
      <path d="M -20 30 C -5 10, -5 -10, -20 -30"/>
      <path d="M 30 30 C 45 10, 45 -10, 30 -30"/>
      <path d="M 80 30 C 95 10, 95 -10, 80 -30"/>
    </g>

    <!-- Flanged End Bearing Blocks -->
    <rect x="-148" y="-20" width="12" height="40" fill="none" stroke="#0ea5e9" stroke-width="1.5"/>
    <rect x="136" y="-20" width="12" height="40" fill="none" stroke="#0ea5e9" stroke-width="1.5"/>

    <!-- Top Inlet Chute & Bottom Discharge Outlet -->
    <polygon points="-125,-65 -85,-65 -90,-35 -120,-35" fill="none" stroke="#0ea5e9" stroke-width="1.5"/>
    <polygon points="85,30 115,30 120,60 80,60" fill="none" stroke="#0ea5e9" stroke-width="1.5"/>

    <!-- Drive Motor Flange (Left) -->
    <rect x="-175" y="-12" width="27" height="24" rx="2" fill="none" stroke="#38bdf8" stroke-width="1.8"/>
  </g>


  <!-- Lower Engineering Status Bar -->
  <rect x="28" y="328" width="544" height="24" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <circle cx="42" cy="340" r="4" fill="#10b981"/>
  <text x="52" y="343" fill="#94a3b8" font-family="'Times New Roman', serif" font-size="9">SOLIDWORKS 3D MODEL &amp; ASSEMBLY ACTIVE | VERIFIED COMPONENT TOLERANCES</text>
  <text x="460" y="343" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="9" font-weight="bold">SCALE 1:1 [METRIC]</text>
</svg>