    <circle cx="120" cy="-35" r="10" fill="none" stroke="#f8fafc" stroke-width="2"/>
    <circle cx="120" cy="-35" r="4" fill="#38bdf8"/>

    <!-- Sculpted Keycap Rows -->
    <g fill="none" stroke="#94a3b8" stroke-width="1">
      <!-- Row 1 -->
      <rect x="-125" y="-40" width="16" height="13" rx="2"/>
      <rect x="-105" y="-40" width="16" height="13" rx="2"/>
      <rect x="-85" y="-40" width="16" height="13" rx="2"/>
      <rect x="-65" y="-40" width="16" height="13" rx="2"/>
      <rect x="-45" y="-40" width="16" height="13" rx="2"/>
      <rect x="-25" y="-40" width="16" height="13" rx="2"/>
      <rect x="-5" y="-40" width="16" height="13" rx="2"/>
      <rect x="15" y="-40" width="16" height="13" rx="2"/>
      <rect x="35" y="-40" width="16" height="13" rx="2"/>
      <rect x="55" y="-40" width="16" height="13" rx="2"/>
      <rect x="75" y="-40" width="16" height="13" rx="2"/>
      <rect x="95" y="-40" width="16" height="13" rx="2"/>

      <!-- Row 2 -->
      <rect x="-128" y="-23" width="20" height="13" rx="2" stroke="#38bdf8"/>
      <rect x="-104" y="-23" width="16" height="13" rx="2"/>
      <rect x="-84" y="-23" width="16" height="13" rx="2"/>
      <rect x="-64" y="-23" width="16" height="13" rx="2"/>
      <rect x="-44" y="-23" width="16" height="13" rx="2"/>
      <rect x="-24" y="-23" width="16" height="13" rx="2"/>
      <rect x="-4" y="-23" width="16" height="13" rx="2"/>
      <rect x="16" y="-23" width="16" height="13" rx="2"/>
      <rect x="36" y="-23" width="16" height="13" rx="2"/>
      <rect x="56" y="-23" width="16" height="13" rx="2"/>
      <rect x="76" y="-23" width="16" height="13" rx="2"/>
      <rect x="96" y="-23" width="22" height="13" rx="2" stroke="#38bdf8"/>

      <!-- Row 3: Spacebar Row -->
      <rect x="-132" y="15" width="25" height="16" rx="2"/>
      <rect x="-103" y="15" width="18" height="16" rx="2"/>
      <!-- Ergonomic Spacebar -->
      <rect x="-80" y="15" width="140" height="16" rx="2" stroke="#f8fafc" stroke-width="2"/>
      <rect x="65" y="15" width="18" height="16" rx="2"/>
      <rect x="88" y="15" width="25" height="16" rx="2"/>
    </g>

    <!-- Brass Weight Inlay Reflection Line -->
    <line x1="-100" y1="46" x2="100" y2="46" stroke="#fbbf24" stroke-width="1.8"/>
  </g>


  <!-- Lower Engineering Status Bar -->
  <rect x="28" y="328" width="544" height="24" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <circle cx="42" cy="340" r="4" fill="#10b981"/>
  <text x="52" y="343" fill="#94a3b8" font-family="'Times New Roman', serif" font-size="9">SOLIDWORKS 3D MODEL &amp; ASSEMBLY ACTIVE | VERIFIED COMPONENT TOLERANCES</text>
  <text x="460" y="343" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="9" font-weight="bold">SCALE 1:1 [METRIC]</text>
</svg>