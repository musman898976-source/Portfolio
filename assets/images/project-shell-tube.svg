<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <pattern id="grid-proj-05" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.7"/>
    </pattern>
    <linearGradient id="hudGrad-proj-05" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="380" fill="#090d16"/>
  <rect width="600" height="380" fill="url(#grid-proj-05)"/>

  <!-- CAD Viewport Overlay Frames -->
  <rect x="20" y="20" width="560" height="340" fill="none" stroke="#1e293b" stroke-width="1"/>
  <rect x="25" y="25" width="550" height="330" fill="none" stroke="#334155" stroke-dasharray="4 4" stroke-width="0.8"/>

  <!-- Title Block (Top Left) -->
  <rect x="28" y="28" width="220" height="70" rx="3" fill="url(#hudGrad-proj-05)" stroke="#38bdf8" stroke-width="0.8" opacity="0.9"/>
  <text x="35" y="44" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="12" font-weight="bold" letter-spacing="1">PROJ-05 // SOLIDWORKS CAD</text>
  
        <text x="35" y="58" fill="#64748b" font-family="'Times New Roman', serif" font-size="10">DISCIPLINE:</text>
        <text x="110" y="58" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">Thermal Equipment</text>
        
        <text x="35" y="72" fill="#64748b" font-family="'Times New Roman', serif" font-size="10">MATERIAL:</text>
        <text x="110" y="72" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">SA-516 Gr. 70 &amp; SS 316L U-Tubes</text>
        
        <text x="35" y="86" fill="#64748b" font-family="'Times New Roman', serif" font-size="10">STANDARD:</text>
        <text x="110" y="86" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">ASME Section VIII Div 1 &amp; TEMA</text>
        
        <text x="35" y="100" fill="#64748b" font-family="'Times New Roman', serif" font-size="10">STATUS:</text>
        <text x="110" y="100" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">Tube Layout Modified</text>
        

  <!-- Viewport Orientation Cube (Top Right) -->
  <g transform="translate(520, 35)">
    <polygon points="20,0 40,10 20,20 0,10" fill="none" stroke="#38bdf8" stroke-width="1"/>
    <polygon points="0,10 20,20 20,40 0,30" fill="none" stroke="#0ea5e9" stroke-width="1"/>
    <polygon points="20,20 40,10 40,30 20,40" fill="none" stroke="#0284c7" stroke-width="1"/>
    <text x="17" y="13" fill="#f8fafc" font-family="'Times New Roman', serif" font-size="8">TOP</text>
    <text x="5" y="27" fill="#f8fafc" font-family="'Times New Roman', serif" font-size="8">FRONT</text>
    <text x="25" y="27" fill="#f8fafc" font-family="'Times New Roman', serif" font-size="8">RIGHT</text>
  </g>

  <!-- Central Engineering Geometry -->
  
  <g transform="translate(300, 200)">
    <!-- Outer Cylindrical Shell Body -->
    <rect x="-120" y="-55" width="230" height="110" rx="6" fill="none" stroke="#38bdf8" stroke-width="2"/>

    <!-- Elliptical Head Caps / Flanged Channel Heads -->
    <!-- Front Channel Head -->
    <path d="M -120 -55 C -150 -55, -150 55, -120 55 Z" fill="none" stroke="#f8fafc" stroke-width="1.8"/>
    <rect x="-122" y="-62" width="10" height="124" rx="2" fill="none" stroke="#0ea5e9" stroke-width="1.5"/>

    <!-- Rear Return Bonnet Cover -->
    <path d="M 110 -55 C 135 -55, 135 55, 110 55 Z" fill="none" stroke="#f8fafc" stroke-width="1.8"/>
    <rect x="105" y="-62" width="10" height="124" rx="2" fill="none" stroke="#0ea5e9" stroke-width="1.5"/>

    <!-- Nozzles: Shell-side & Tube-side -->
    <rect x="-95" y="-85" width="28" height="30" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="-100" y="-92" width="38" height="7" rx="1" fill="none" stroke="#f8fafc" stroke-width="1.5"/>

    <rect x="65" y="55" width="28" height="30" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="60" y="85" width="38" height="7" rx="1" fill="none" stroke="#f8fafc" stroke-width="1.5"/>

    <!-- Internal U-Tube Bundle / Straight Tubes (Dashed) -->
    <g stroke="#94a3b8" stroke-width="1" stroke-dasharray="5 3">
      <line x1="-110" y1="-35" x2="95" y2="-35"/>
      <line x1="-110" y1="-15" x2="95" y2="-15"/>
      <line x1="-110" y1="5" x2="95" y2="5"/>
      <line x1="-110" y1="25" x2="95" y2="25"/>
    </g>

    <!-- Transverse Segmental Baffles -->
    <line x1="-60" y1="-55" x2="-60" y2="25" stroke="#0ea5e9" stroke-width="2.2"/>
    <line x1="-10" y1="-25" x2="-10" y2="55" stroke="#0ea5e9" stroke-width="2.2"/>
    <line x1="40" y1="-55" x2="40" y2="25" stroke="#0ea5e9" stroke-width="2.2"/>

    <!-- Support Saddles -->
    <polygon points="-80,55 -60,85 -100,85" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <polygon points="70,55 90,85 50,85" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
  </g>


  <!-- Lower Engineering Status Bar -->
  <rect x="28" y="328" width="544" height="24" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <circle cx="42" cy="340" r="4" fill="#10b981"/>
  <text x="52" y="343" fill="#94a3b8" font-family="'Times New Roman', serif" font-size="9">SOLIDWORKS 3D MODEL &amp; ASSEMBLY ACTIVE | VERIFIED COMPONENT TOLERANCES</text>
  <text x="460" y="343" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="9" font-weight="bold">SCALE 1:1 [METRIC]</text>
</svg>