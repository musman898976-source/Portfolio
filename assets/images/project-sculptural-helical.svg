<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <pattern id="grid-proj-30" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.7"/>
    </pattern>
    <linearGradient id="hudGrad-proj-30" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="380" fill="#090d16"/>
  <rect width="600" height="380" fill="url(#grid-proj-30)"/>

  <!-- CAD Viewport Overlay Frames -->
  <rect x="20" y="20" width="560" height="340" fill="none" stroke="#1e293b" stroke-width="1"/>
  <rect x="25" y="25" width="550" height="330" fill="none" stroke="#334155" stroke-dasharray="4 4" stroke-width="0.8"/>

  <!-- Title Block (Top Left) -->
  <rect x="28" y="28" width="220" height="70" rx="3" fill="url(#hudGrad-proj-30)" stroke="#38bdf8" stroke-width="0.8" opacity="0.9"/>
  <text x="35" y="44" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="12" font-weight="bold" letter-spacing="1">PROJ-30 // SOLIDWORKS CAD</text>
  
        <text x="35" y="58" fill="#64748b" font-family="'Times New Roman', serif" font-size="10">DISCIPLINE:</text>
        <text x="110" y="58" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">Mechanical Design</text>
        
        <text x="35" y="72" fill="#64748b" font-family="'Times New Roman', serif" font-size="10">MATERIAL:</text>
        <text x="110" y="72" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">Aluminium 6061-T6 (Suggested)</text>
        
        <text x="35" y="86" fill="#64748b" font-family="'Times New Roman', serif" font-size="10">GEOMETRY:</text>
        <text x="110" y="86" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">Continuous G2 Spatial Spline</text>
        
        <text x="35" y="100" fill="#64748b" font-family="'Times New Roman', serif" font-size="10">STATUS:</text>
        <text x="110" y="100" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">Curvature Comb Verified</text>
        

  <!-- Viewport Orientation Cube (Top Right) -->
  <g transform="translate(520, 35)">
    <polygon points="20,0 40,10 20,20 0,10" fill="none" stroke="#38bdf8" stroke-width="1"/>
    <polygon points="0,10 20,20 20,40 0,30" fill="none" stroke="#0ea5e9" stroke-width="1"/>
    <polygon points="20,20 40,10 40,30 20,40" fill="none" stroke="#0284c7" stroke-width="1"/>
    <text x="17" y="13" fill="#f8fafc" font-family="'Times New Roman', serif" font-size="8">TOP</text>
    <text x="5" y="27" fill="#f8fafc" font-family="'Times New Roman', serif" font-size="8">FRONT</text>
    <text x="25" y="27" fill="#f8fafc" font-family="'Times New Roman', serif" font-size="8">RIGHT</text>
  </g>

  <!-- Central Engineering Geometry -->
  
  <g transform="translate(300, 200)">
    <!-- Triple Intertwined Helical Strands / Dynamic Toroid -->
    <path d="M -115 0 C -115 -85, -55 -100, 0 -100 C 55 -100, 115 -85, 115 0 C 115 85, 55 100, 0 100 C -55 100, -115 85, -115 0" 
          fill="none" stroke="#38bdf8" stroke-width="2.5"/>

    <!-- Interlaced Spatial Helical Coils -->
    <path d="M -115 0 Q -50 60, 0 0 Q 50 -60, 115 0" fill="none" stroke="#f8fafc" stroke-width="2.2"/>
    <path d="M -115 0 Q -50 -60, 0 0 Q 50 60, 115 0" fill="none" stroke="#0ea5e9" stroke-width="1.8"/>

    <!-- Curvature Combs / Spline Tangent Vectors -->
    <line x1="-115" y1="0" x2="-130" y2="0" stroke="#10b981" stroke-width="1.2"/>
    <line x1="115" y1="0" x2="130" y2="0" stroke="#10b981" stroke-width="1.2"/>
    <line x1="0" y1="-100" x2="0" y2="-115" stroke="#10b981" stroke-width="1.2"/>
    <line x1="0" y1="100" x2="0" y2="115" stroke="#10b981" stroke-width="1.2"/>

    <!-- Cross Section Spline Nodes -->
    <ellipse cx="-60" cy="-40" rx="14" ry="26" transform="rotate(-35, -60, -40)" fill="none" stroke="#94a3b8" stroke-width="1"/>
    <ellipse cx="60" cy="40" rx="14" ry="26" transform="rotate(-35, 60, 40)" fill="none" stroke="#94a3b8" stroke-width="1"/>
    <circle cx="0" cy="0" r="5" fill="#38bdf8"/>
    <text x="-65" y="125" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="9">MATHEMATICAL SPLINE CONTINUITY</text>
  </g>


  <!-- Lower Engineering Status Bar -->
  <rect x="28" y="328" width="544" height="24" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <circle cx="42" cy="340" r="4" fill="#10b981"/>
  <text x="52" y="343" fill="#94a3b8" font-family="'Times New Roman', serif" font-size="9">SOLIDWORKS 3D MODEL &amp; ASSEMBLY ACTIVE | VERIFIED COMPONENT TOLERANCES</text>
  <text x="460" y="343" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="9" font-weight="bold">SCALE 1:1 [METRIC]</text>
</svg>