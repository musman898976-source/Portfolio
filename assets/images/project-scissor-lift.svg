<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <pattern id="grid-proj-32" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.7"/>
    </pattern>
    <linearGradient id="hudGrad-proj-32" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="380" fill="#090d16"/>
  <rect width="600" height="380" fill="url(#grid-proj-32)"/>

  <!-- CAD Viewport Overlay Frames -->
  <rect x="20" y="20" width="560" height="340" fill="none" stroke="#1e293b" stroke-width="1"/>
  <rect x="25" y="25" width="550" height="330" fill="none" stroke="#334155" stroke-dasharray="4 4" stroke-width="0.8"/>

  <!-- Title Block (Top Left) -->
  <rect x="28" y="28" width="220" height="70" rx="3" fill="url(#hudGrad-proj-32)" stroke="#38bdf8" stroke-width="0.8" opacity="0.9"/>
  <text x="35" y="44" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="12" font-weight="bold" letter-spacing="1">PROJ-32 // SOLIDWORKS CAD</text>
  
        <text x="35" y="58" fill="#64748b" font-family="'Times New Roman', serif" font-size="10">DISCIPLINE:</text>
        <text x="110" y="58" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">Material Handling</text>
        
        <text x="35" y="72" fill="#64748b" font-family="'Times New Roman', serif" font-size="10">MATERIAL:</text>
        <text x="110" y="72" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">Structural Box Steel &amp; 4140 Pins</text>
        
        <text x="35" y="86" fill="#64748b" font-family="'Times New Roman', serif" font-size="10">MECHANISM:</text>
        <text x="110" y="86" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">Cross-Pantograph Linkage</text>
        
        <text x="35" y="100" fill="#64748b" font-family="'Times New Roman', serif" font-size="10">STATUS:</text>
        <text x="110" y="100" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">Stress &amp; Deflection Validated</text>
        

  <!-- Viewport Orientation Cube (Top Right) -->
  <g transform="translate(520, 35)">
    <polygon points="20,0 40,10 20,20 0,10" fill="none" stroke="#38bdf8" stroke-width="1"/>
    <polygon points="0,10 20,20 20,40 0,30" fill="none" stroke="#0ea5e9" stroke-width="1"/>
    <polygon points="20,20 40,10 40,30 20,40" fill="none" stroke="#0284c7" stroke-width="1"/>
    <text x="17" y="13" fill="#f8fafc" font-family="'Times New Roman', serif" font-size="8">TOP</text>
    <text x="5" y="27" fill="#f8fafc" font-family="'Times New Roman', serif" font-size="8">FRONT</text>
    <text x="25" y="27" fill="#f8fafc" font-family="'Times New Roman', serif" font-size="8">RIGHT</text>
  </g>

  <!-- Central Engineering Geometry -->
  
  <g transform="translate(300, 210)">
    <!-- Ground Base Frame -->
    <rect x="-130" y="65" width="260" height="15" rx="2" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="-110" cy="72" r="4" fill="#38bdf8"/>
    <circle cx="110" cy="72" r="4" fill="#38bdf8"/>

    <!-- Scissor Arms (Cross-X Pantograph Structure) -->
    <!-- Arm 1A (Fixed Base Left to Moving Top Right) -->
    <line x1="-110" y1="65" x2="100" y2="-35" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <!-- Arm 1B (Moving Base Right to Fixed Top Left) -->
    <line x1="80" y1="65" x2="-90" y2="-35" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Central Scissor Center Pivot Pin -->
    <circle cx="-5" cy="15" r="7" fill="#090d16" stroke="#f8fafc" stroke-width="2"/>
    <circle cx="-5" cy="15" r="3" fill="#38bdf8"/>

    <!-- Rollers on Base & Top -->
    <circle cx="80" cy="65" r="6" fill="none" stroke="#0ea5e9" stroke-width="2"/>
    <circle cx="100" cy="-35" r="6" fill="none" stroke="#0ea5e9" stroke-width="2"/>

    <!-- Dual Hydraulic Lift Cylinders -->
    <line x1="-80" y1="65" x2="10" y2="5" stroke="#94a3b8" stroke-width="3.5"/>
    <circle cx="-80" cy="65" r="4" fill="#38bdf8"/>
    <circle cx="10" cy="5" r="4" fill="#38bdf8"/>

    <!-- Top Lifting Deck Platform with Safety Kick-Plates -->
    <rect x="-130" y="-45" width="260" height="10" rx="2" fill="none" stroke="#f8fafc" stroke-width="2"/>
    <line x1="-130" y1="-85" x2="130" y2="-85" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="-130" y1="-85" x2="-130" y2="-45" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="130" y1="-85" x2="130" y2="-45" stroke="#38bdf8" stroke-width="1.5"/>
  </g>


  <!-- Lower Engineering Status Bar -->
  <rect x="28" y="328" width="544" height="24" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <circle cx="42" cy="340" r="4" fill="#10b981"/>
  <text x="52" y="343" fill="#94a3b8" font-family="'Times New Roman', serif" font-size="9">SOLIDWORKS 3D MODEL &amp; ASSEMBLY ACTIVE | VERIFIED COMPONENT TOLERANCES</text>
  <text x="460" y="343" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="9" font-weight="bold">SCALE 1:1 [METRIC]</text>
</svg>