  <text x="35" y="350" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="8">SCALE: 1:2.5 (METRIC) | PROJECTION: THIRD ANGLE | GD&amp;T: ASME Y14.5M</text>
