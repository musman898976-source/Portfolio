    <rect x="100" y="120" width="400" height="180" rx="4" fill="none" stroke="#38bdf8" stroke-width="2"/><rect x="120" y="140" width="360" height="140" rx="2" fill="none" stroke="#2563eb" stroke-dasharray="4 2"/><line x1="80" y1="140" x2="100" y2="140" stroke="#38bdf8" stroke-width="2"/><line x1="80" y1="280" x2="100" y2="280" stroke="#38bdf8" stroke-width="2"/><circle cx="90" cy="160" r="5" fill="none" stroke="#f59e0b" stroke-width="1.5"/><circle cx="90" cy="260" r="5" fill="none" stroke="#f59e0b" stroke-width="1.5"/><circle cx="510" cy="160" r="5" fill="none" stroke="#f59e0b" stroke-width="1.5"/><circle cx="510" cy="260" r="5" fill="none" stroke="#f59e0b" stroke-width="1.5"/><line x1="160" y1="160" x2="160" y2="260" stroke="#38bdf8" stroke-width="1"/><line x1="190" y1="160" x2="190" y2="260" stroke="#38bdf8" stroke-width="1"/><line x1="220" y1="160" x2="220" y2="260" stroke="#38bdf8" stroke-width="1"/><text x="140" y="215" fill="#94a3b8" font-family="monospace" font-size="10">VENTILATION ARRAY [32 SLOTS]</text><line x1="100" y1="90" x2="500" y2="90" stroke="#94a3b8" stroke-width="1"/><text x="270" y="85" fill="#94a3b8" font-family="monospace" font-size="11">482.6 mm [19.00 IN]</text><line x1="520" y1="120" x2="520" y2="300" stroke="#94a3b8" stroke-width="1"/><text x="530" y="215" fill="#94a3b8" font-family="monospace" font-size="11">88.9 mm (2U)</text>
