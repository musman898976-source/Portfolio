<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <pattern id="grid-proj-23" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.7"/>
    </pattern>
    <linearGradient id="hudGrad-proj-23" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="380" fill="#090d16"/>
  <rect width="600" height="380" fill="url(#grid-proj-23)"/>

  <!-- CAD Viewport Overlay Frames -->
  <rect x="20" y="20" width="560" height="340" fill="none" stroke="#1e293b" stroke-width="1"/>
  <rect x="25" y="25" width="550" height="330" fill="none" stroke="#334155" stroke-dasharray="4 4" stroke-width="0.8"/>

  <!-- Title Block (Top Left) -->
  <rect x="28" y="28" width="220" height="70" rx="3" fill="url(#hudGrad-proj-23)" stroke="#38bdf8" stroke-width="0.8" opacity="0.9"/>
  <text x="35" y="44" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="12" font-weight="bold" letter-spacing="1">PROJ-23 // SOLIDWORKS CAD</text>
  
        <text x="35" y="58" fill="#64748b" font-family="'Times New Roman', serif" font-size="10">DISCIPLINE:</text>
        <text x="110" y="58" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">Material Handling</text>
        
        <text x="35" y="72" fill="#64748b" font-family="'Times New Roman', serif" font-size="10">MATERIAL:</text>
        <text x="110" y="72" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">High-Yield Steel &amp; 4140 Pins</text>
        
        <text x="35" y="86" fill="#64748b" font-family="'Times New Roman', serif" font-size="10">FEATURES:</text>
        <text x="110" y="86" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">Outrigger Base &amp; Slew Turret</text>
        
        <text x="35" y="100" fill="#64748b" font-family="'Times New Roman', serif" font-size="10">STATUS:</text>
        <text x="110" y="100" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">360-Deg Stability Analyzed</text>
        

  <!-- Viewport Orientation Cube (Top Right) -->
  <g transform="translate(520, 35)">
    <polygon points="20,0 40,10 20,20 0,10" fill="none" stroke="#38bdf8" stroke-width="1"/>
    <polygon points="0,10 20,20 20,40 0,30" fill="none" stroke="#0ea5e9" stroke-width="1"/>
    <polygon points="20,20 40,10 40,30 20,40" fill="none" stroke="#0284c7" stroke-width="1"/>
    <text x="17" y="13" fill="#f8fafc" font-family="'Times New Roman', serif" font-size="8">TOP</text>
    <text x="5" y="27" fill="#f8fafc" font-family="'Times New Roman', serif" font-size="8">FRONT</text>
    <text x="25" y="27" fill="#f8fafc" font-family="'Times New Roman', serif" font-size="8">RIGHT</text>
  </g>

  <!-- Central Engineering Geometry -->
  
  <g transform="translate(300, 210)">
    <!-- Base Wheeled Chassis & Stabilizer Outriggers -->
    <rect x="-110" y="45" width="160" height="30" rx="3" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="-85" cy="75" r="15" fill="none" stroke="#0ea5e9" stroke-width="2"/>
    <circle cx="20" cy="75" r="15" fill="none" stroke="#0ea5e9" stroke-width="2"/>
    <!-- Outriggers Extended -->
    <line x1="-110" y1="55" x2="-140" y2="85" stroke="#38bdf8" stroke-width="2.5"/>
    <rect x="-150" y="85" width="20" height="4" fill="#38bdf8"/>
    <line x1="50" y1="55" x2="80" y2="85" stroke="#38bdf8" stroke-width="2.5"/>
    <rect x="70" y="85" width="20" height="4" fill="#38bdf8"/>

    <!-- 360-Degree Turntable Slew Base -->
    <rect x="-95" y="25" width="45" height="20" rx="2" fill="none" stroke="#f8fafc" stroke-width="1.5"/>
    <circle cx="-72" cy="25" r="5" fill="#38bdf8"/>

    <!-- Dual Articulated Lower Knuckle Boom -->
    <line x1="-72" y1="25" x2="-35" y2="-45" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <circle cx="-35" cy="-45" r="6" fill="#090d16" stroke="#38bdf8" stroke-width="2"/>

    <!-- Upper Telescopic Boom Section -->
    <line x1="-35" y1="-45" x2="80" y2="-80" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="80" y1="-80" x2="110" y2="-75" stroke="#0ea5e9" stroke-width="2.5"/>
    <circle cx="80" cy="-80" r="5" fill="#090d16" stroke="#0ea5e9" stroke-width="2"/>

    <!-- Operator Safety Work Cage / Basket -->
    <rect x="110" y="-105" width="45" height="35" rx="2" fill="none" stroke="#f8fafc" stroke-width="1.8"/>
    <line x1="110" y1="-90" x2="155" y2="-90" stroke="#94a3b8" stroke-width="1"/>
    <circle cx="132" cy="-113" r="5" fill="none" stroke="#38bdf8" stroke-width="1.2"/>
    <line x1="132" y1="-108" x2="132" y2="-90" stroke="#38bdf8" stroke-width="1.2"/>
  </g>


  <!-- Lower Engineering Status Bar -->
  <rect x="28" y="328" width="544" height="24" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <circle cx="42" cy="340" r="4" fill="#10b981"/>
  <text x="52" y="343" fill="#94a3b8" font-family="'Times New Roman', serif" font-size="9">SOLIDWORKS 3D MODEL &amp; ASSEMBLY ACTIVE | VERIFIED COMPONENT TOLERANCES</text>
  <text x="460" y="343" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="9" font-weight="bold">SCALE 1:1 [METRIC]</text>
</svg>