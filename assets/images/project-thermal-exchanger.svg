<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <pattern id="grid-proj-28" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.7"/>
    </pattern>
    <linearGradient id="hudGrad-proj-28" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="380" fill="#090d16"/>
  <rect width="600" height="380" fill="url(#grid-proj-28)"/>

  <!-- CAD Viewport Overlay Frames -->
  <rect x="20" y="20" width="560" height="340" fill="none" stroke="#1e293b" stroke-width="1"/>
  <rect x="25" y="25" width="550" height="330" fill="none" stroke="#334155" stroke-dasharray="4 4" stroke-width="0.8"/>

  <!-- Title Block (Top Left) -->
  <rect x="28" y="28" width="220" height="70" rx="3" fill="url(#hudGrad-proj-28)" stroke="#38bdf8" stroke-width="0.8" opacity="0.9"/>
  <text x="35" y="44" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="12" font-weight="bold" letter-spacing="1">PROJ-28 // SOLIDWORKS CAD</text>
  
        <text x="35" y="58" fill="#64748b" font-family="'Times New Roman', serif" font-size="10">DISCIPLINE:</text>
        <text x="110" y="58" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">Thermal Equipment</text>
        
        <text x="35" y="72" fill="#64748b" font-family="'Times New Roman', serif" font-size="10">MATERIAL:</text>
        <text x="110" y="72" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">SA-516 Gr. 70 &amp; SS 316L Tubes</text>
        
        <text x="35" y="86" fill="#64748b" font-family="'Times New Roman', serif" font-size="10">DESIGN:</text>
        <text x="110" y="86" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">Multi-Pass Segmental Baffles</text>
        
        <text x="35" y="100" fill="#64748b" font-family="'Times New Roman', serif" font-size="10">STATUS:</text>
        <text x="110" y="100" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">ASME Section VIII Rated</text>
        

  <!-- Viewport Orientation Cube (Top Right) -->
  <g transform="translate(520, 35)">
    <polygon points="20,0 40,10 20,20 0,10" fill="none" stroke="#38bdf8" stroke-width="1"/>
    <polygon points="0,10 20,20 20,40 0,30" fill="none" stroke="#0ea5e9" stroke-width="1"/>
    <polygon points="20,20 40,10 40,30 20,40" fill="none" stroke="#0284c7" stroke-width="1"/>
    <text x="17" y="13" fill="#f8fafc" font-family="'Times New Roman', serif" font-size="8">TOP</text>
    <text x="5" y="27" fill="#f8fafc" font-family="'Times New Roman', serif" font-size="8">FRONT</text>
    <text x="25" y="27" fill="#f8fafc" font-family="'Times New Roman', serif" font-size="8">RIGHT</text>
  </g>

  <!-- Central Engineering Geometry -->
  
  <g transform="translate(300, 200)">
    <!-- Cylindrical Shell & Torispherical Heads -->
    <rect x="-120" y="-60" width="240" height="120" rx="8" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <path d="M -120 -60 C -145 -60, -145 60, -120 60 Z" fill="none" stroke="#0ea5e9" stroke-width="1.8"/>
    <path d="M 120 -60 C 145 -60, 145 60, 120 60 Z" fill="none" stroke="#0ea5e9" stroke-width="1.8"/>

    <!-- Flanged Nozzle Inlet & Outlet with Valves -->
    <rect x="-70" y="-95" width="30" height="35" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="-76" y="-102" width="42" height="7" rx="1" fill="none" stroke="#f8fafc" stroke-width="1.5"/>
    <rect x="40" y="60" width="30" height="35" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="34" y="95" width="42" height="7" rx="1" fill="none" stroke="#f8fafc" stroke-width="1.5"/>

    <!-- Internal Multi-Pass Tube Bundle -->
    <g stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 2">
      <line x1="-110" y1="-40" x2="110" y2="-40"/>
      <line x1="-110" y1="-20" x2="110" y2="-20"/>
      <line x1="-110" y1="0" x2="110" y2="0"/>
      <line x1="-110" y1="20" x2="110" y2="20"/>
      <line x1="-110" y1="40" x2="110" y2="40"/>
    </g>

    <!-- Transverse Segmental Baffle Plates -->
    <line x1="-40" y1="-60" x2="-40" y2="20" stroke="#0ea5e9" stroke-width="2.5"/>
    <line x1="15" y1="-20" x2="15" y2="60" stroke="#0ea5e9" stroke-width="2.5"/>
    <line x1="70" y1="-60" x2="70" y2="20" stroke="#0ea5e9" stroke-width="2.5"/>

    <!-- Saddle Supports with Anchor Bolt Slots -->
    <polygon points="-85,60 -65,85 -105,85" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <polygon points="65,60 85,85 45,85" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
  </g>


  <!-- Lower Engineering Status Bar -->
  <rect x="28" y="328" width="544" height="24" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <circle cx="42" cy="340" r="4" fill="#10b981"/>
  <text x="52" y="343" fill="#94a3b8" font-family="'Times New Roman', serif" font-size="9">SOLIDWORKS 3D MODEL &amp; ASSEMBLY ACTIVE | VERIFIED COMPONENT TOLERANCES</text>
  <text x="460" y="343" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="9" font-weight="bold">SCALE 1:1 [METRIC]</text>
</svg>