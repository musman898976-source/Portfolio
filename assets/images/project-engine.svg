<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <pattern id="grid-proj-02" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.7"/>
    </pattern>
    <linearGradient id="hudGrad-proj-02" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="380" fill="#090d16"/>
  <rect width="600" height="380" fill="url(#grid-proj-02)"/>

  <!-- CAD Viewport Overlay Frames -->
  <rect x="20" y="20" width="560" height="340" fill="none" stroke="#1e293b" stroke-width="1"/>
  <rect x="25" y="25" width="550" height="330" fill="none" stroke="#334155" stroke-dasharray="4 4" stroke-width="0.8"/>

  <!-- Title Block (Top Left) -->
  <rect x="28" y="28" width="220" height="70" rx="3" fill="url(#hudGrad-proj-02)" stroke="#38bdf8" stroke-width="0.8" opacity="0.9"/>
  <text x="35" y="44" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="12" font-weight="bold" letter-spacing="1">PROJ-02 // SOLIDWORKS CAD</text>
  
        <text x="35" y="58" fill="#64748b" font-family="'Times New Roman', serif" font-size="10">DISCIPLINE:</text>
        <text x="110" y="58" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">Mechanical Assemblies</text>
        
        <text x="35" y="72" fill="#64748b" font-family="'Times New Roman', serif" font-size="10">MATERIAL:</text>
        <text x="110" y="72" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">Al Alloy &amp; Alloy Steel</text>
        
        <text x="35" y="86" fill="#64748b" font-family="'Times New Roman', serif" font-size="10">SOFTWARE:</text>
        <text x="110" y="86" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">SolidWorks Assembly &amp; Motion</text>
        
        <text x="35" y="100" fill="#64748b" font-family="'Times New Roman', serif" font-size="10">STATUS:</text>
        <text x="110" y="100" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">Production Verified</text>
        

  <!-- Viewport Orientation Cube (Top Right) -->
  <g transform="translate(520, 35)">
    <polygon points="20,0 40,10 20,20 0,10" fill="none" stroke="#38bdf8" stroke-width="1"/>
    <polygon points="0,10 20,20 20,40 0,30" fill="none" stroke="#0ea5e9" stroke-width="1"/>
    <polygon points="20,20 40,10 40,30 20,40" fill="none" stroke="#0284c7" stroke-width="1"/>
    <text x="17" y="13" fill="#f8fafc" font-family="'Times New Roman', serif" font-size="8">TOP</text>
    <text x="5" y="27" fill="#f8fafc" font-family="'Times New Roman', serif" font-size="8">FRONT</text>
    <text x="25" y="27" fill="#f8fafc" font-family="'Times New Roman', serif" font-size="8">RIGHT</text>
  </g>

  <!-- Central Engineering Geometry -->
  
  <g transform="translate(300, 205)">
    <!-- Engine Block Outline -->
    <path d="M -130 90 L -110 -60 L 110 -60 L 130 90 Z" fill="none" stroke="#38bdf8" stroke-width="1.8"/>
    <rect x="-140" y="85" width="280" height="20" rx="3" fill="none" stroke="#0ea5e9" stroke-width="1.5"/>
    
    <!-- Cylinders (V-configuration or Multi-cylinder inline) -->
    <!-- Cylinder 1 -->
    <rect x="-95" y="-50" width="50" height="85" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 3"/>
    <rect x="-90" y="-35" width="40" height="35" rx="2" fill="none" stroke="#f8fafc" stroke-width="1.4"/>
    <line x1="-70" y1="0" x2="-55" y2="55" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="-70" cy="0" r="4" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    
    <!-- Cylinder 2 -->
    <rect x="-30" y="-50" width="50" height="85" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 3"/>
    <rect x="-25" y="-15" width="40" height="35" rx="2" fill="none" stroke="#f8fafc" stroke-width="1.4"/>
    <line x1="-5" y1="20" x2="-5" y2="65" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="-5" cy="20" r="4" fill="none" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- Cylinder 3 -->
    <rect x="35" y="-50" width="50" height="85" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 3"/>
    <rect x="40" y="-40" width="40" height="35" rx="2" fill="none" stroke="#f8fafc" stroke-width="1.4"/>
    <line x1="60" y1="-5" x2="45" y2="55" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="60" cy="-5" r="4" fill="none" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- Crankshaft Axis & Counterweights -->
    <ellipse cx="-55" cy="65" rx="16" ry="16" fill="none" stroke="#0284c7" stroke-width="1.5"/>
    <ellipse cx="-5" cy="65" rx="16" ry="16" fill="none" stroke="#0284c7" stroke-width="1.5"/>
    <ellipse cx="45" cy="65" rx="16" ry="16" fill="none" stroke="#0284c7" stroke-width="1.5"/>
    <line x1="-120" y1="65" x2="120" y2="65" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="6 2"/>
    <circle cx="0" cy="65" r="3" fill="#38bdf8"/>

    <!-- Cylinder Head & Valve Covers -->
    <polygon points="-120,-60 -100,-85 100,-85 120,-60" fill="none" stroke="#0ea5e9" stroke-width="1.6"/>
    <circle cx="-70" cy="-72" r="7" fill="none" stroke="#94a3b8" stroke-width="1"/>
    <circle cx="-5" cy="-72" r="7" fill="none" stroke="#94a3b8" stroke-width="1"/>
    <circle cx="60" cy="-72" r="7" fill="none" stroke="#94a3b8" stroke-width="1"/>

    <!-- Dimension Callouts -->
    <line x1="125" y1="-60" x2="160" y2="-60" stroke="#64748b" stroke-width="0.8"/>
    <line x1="135" y1="90" x2="160" y2="90" stroke="#64748b" stroke-width="0.8"/>
    <line x1="155" y1="-60" x2="155" y2="90" stroke="#38bdf8" stroke-width="0.8"/>
    <text x="163" y="20" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10">H: 340 mm</text>
  </g>


  <!-- Lower Engineering Status Bar -->
  <rect x="28" y="328" width="544" height="24" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <circle cx="42" cy="340" r="4" fill="#10b981"/>
  <text x="52" y="343" fill="#94a3b8" font-family="'Times New Roman', serif" font-size="9">SOLIDWORKS 3D MODEL &amp; ASSEMBLY ACTIVE | VERIFIED COMPONENT TOLERANCES</text>
  <text x="460" y="343" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="9" font-weight="bold">SCALE 1:1 [METRIC]</text>
</svg>