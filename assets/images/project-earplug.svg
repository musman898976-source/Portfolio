<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <pattern id="grid-proj-09" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.7"/>
    </pattern>
    <linearGradient id="hudGrad-proj-09" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="380" fill="#090d16"/>
  <rect width="600" height="380" fill="url(#grid-proj-09)"/>

  <!-- CAD Viewport Overlay Frames -->
  <rect x="20" y="20" width="560" height="340" fill="none" stroke="#1e293b" stroke-width="1"/>
  <rect x="25" y="25" width="550" height="330" fill="none" stroke="#334155" stroke-dasharray="4 4" stroke-width="0.8"/>

  <!-- Title Block (Top Left) -->
  <rect x="28" y="28" width="220" height="70" rx="3" fill="url(#hudGrad-proj-09)" stroke="#38bdf8" stroke-width="0.8" opacity="0.9"/>
  <text x="35" y="44" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="12" font-weight="bold" letter-spacing="1">PROJ-09 // SOLIDWORKS CAD</text>
  
        <text x="35" y="58" fill="#64748b" font-family="'Times New Roman', serif" font-size="10">DISCIPLINE:</text>
        <text x="110" y="58" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">Product &amp; Prototype</text>
        
        <text x="35" y="72" fill="#64748b" font-family="'Times New Roman', serif" font-size="10">MATERIAL:</text>
        <text x="110" y="72" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">Medical Liquid Silicone &amp; TPE</text>
        
        <text x="35" y="86" fill="#64748b" font-family="'Times New Roman', serif" font-size="10">DELIVERABLE:</text>
        <text x="110" y="86" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">SLA 3D-Printed Prototype Shipped</text>
        
        <text x="35" y="100" fill="#64748b" font-family="'Times New Roman', serif" font-size="10">STATUS:</text>
        <text x="110" y="100" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">Physical Prototype Delivered</text>
        

  <!-- Viewport Orientation Cube (Top Right) -->
  <g transform="translate(520, 35)">
    <polygon points="20,0 40,10 20,20 0,10" fill="none" stroke="#38bdf8" stroke-width="1"/>
    <polygon points="0,10 20,20 20,40 0,30" fill="none" stroke="#0ea5e9" stroke-width="1"/>
    <polygon points="20,20 40,10 40,30 20,40" fill="none" stroke="#0284c7" stroke-width="1"/>
    <text x="17" y="13" fill="#f8fafc" font-family="'Times New Roman', serif" font-size="8">TOP</text>
    <text x="5" y="27" fill="#f8fafc" font-family="'Times New Roman', serif" font-size="8">FRONT</text>
    <text x="25" y="27" fill="#f8fafc" font-family="'Times New Roman', serif" font-size="8">RIGHT</text>
  </g>

  <!-- Central Engineering Geometry -->
  
  <g transform="translate(300, 200)">
    <!-- Triple-Flange Ergonomic Earplug Profile (Orthogonal & Section) -->
    <!-- Left Plug (Exterior View) -->
    <g transform="translate(-70, 0)">
      <!-- Outer Tip Flange (Smallest) -->
      <path d="M -12 -70 C -15 -50, 15 -50, 12 -70 Z" fill="none" stroke="#38bdf8" stroke-width="2"/>
      <ellipse cx="0" cy="-70" rx="12" ry="5" fill="none" stroke="#0ea5e9" stroke-width="1.5"/>

      <!-- Middle Flange -->
      <path d="M -22 -40 C -25 -20, 25 -20, 22 -40" fill="none" stroke="#38bdf8" stroke-width="2"/>
      <ellipse cx="0" cy="-40" rx="22" ry="7" fill="none" stroke="#0ea5e9" stroke-width="1.5"/>

      <!-- Base Main Flange (Largest) -->
      <path d="M -32 -10 C -36 15, 36 15, 32 -10" fill="none" stroke="#38bdf8" stroke-width="2"/>
      <ellipse cx="0" cy="-10" rx="32" ry="9" fill="none" stroke="#0ea5e9" stroke-width="1.5"/>

      <!-- Ergonomic Grip Stem & Extraction Cord Socket -->
      <path d="M -10 15 L -10 65 C -10 75, 10 75, 10 65 L 10 15" fill="none" stroke="#f8fafc" stroke-width="2"/>
      <circle cx="0" cy="50" r="4" fill="#38bdf8"/>
    </g>

    <!-- Right Plug (Internal Cutaway Section) -->
    <g transform="translate(70, 0)">
      <path d="M 0 -75 L 14 -70 C 12 -55, 0 -52, 0 -52" fill="none" stroke="#38bdf8" stroke-width="1.8"/>
      <path d="M 0 -52 L 24 -40 C 22 -25, 0 -22, 0 -22" fill="none" stroke="#38bdf8" stroke-width="1.8"/>
      <path d="M 0 -22 L 34 -10 C 30 10, 0 14, 0 14" fill="none" stroke="#38bdf8" stroke-width="1.8"/>
      <path d="M 0 14 L 10 15 L 10 65 C 10 75, 0 75, 0 75 Z" fill="none" stroke="#f8fafc" stroke-width="1.8"/>
      
      <!-- Central Acoustic Attenuation Filter / Bore -->
      <rect x="0" y="-60" width="5" height="120" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 2"/>
      <!-- Internal Filter Mesh Capsule -->
      <rect x="0" y="0" width="8" height="25" fill="#38bdf8" opacity="0.3"/>
      <line x1="0" y1="0" x2="8" y2="25" stroke="#38bdf8" stroke-width="1"/>
      <line x1="0" y1="25" x2="8" y2="0" stroke="#38bdf8" stroke-width="1"/>
    </g>

    <!-- Center Line Callout -->
    <line x1="0" y1="-80" x2="0" y2="80" stroke="#64748b" stroke-width="1" stroke-dasharray="6 3"/>
  </g>


  <!-- Lower Engineering Status Bar -->
  <rect x="28" y="328" width="544" height="24" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <circle cx="42" cy="340" r="4" fill="#10b981"/>
  <text x="52" y="343" fill="#94a3b8" font-family="'Times New Roman', serif" font-size="9">SOLIDWORKS 3D MODEL &amp; ASSEMBLY ACTIVE | VERIFIED COMPONENT TOLERANCES</text>
  <text x="460" y="343" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="9" font-weight="bold">SCALE 1:1 [METRIC]</text>
</svg>