<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <pattern id="grid-proj-39" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.7"/>
    </pattern>
    <linearGradient id="hudGrad-proj-39" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="380" fill="#090d16"/>
  <rect width="600" height="380" fill="url(#grid-proj-39)"/>

  <!-- CAD Viewport Overlay Frames -->
  <rect x="20" y="20" width="560" height="340" fill="none" stroke="#1e293b" stroke-width="1"/>
  <rect x="25" y="25" width="550" height="330" fill="none" stroke="#334155" stroke-dasharray="4 4" stroke-width="0.8"/>

  <!-- Title Block (Top Left) -->
  <rect x="28" y="28" width="220" height="70" rx="3" fill="url(#hudGrad-proj-39)" stroke="#38bdf8" stroke-width="0.8" opacity="0.9"/>
  <text x="35" y="44" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="12" font-weight="bold" letter-spacing="1">PROJ-39 // SOLIDWORKS CAD</text>
  
        <text x="35" y="58" fill="#64748b" font-family="'Times New Roman', serif" font-size="10">DISCIPLINE:</text>
        <text x="110" y="58" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">Sheet Metal Design</text>
        
        <text x="35" y="72" fill="#64748b" font-family="'Times New Roman', serif" font-size="10">MATERIAL:</text>
        <text x="110" y="72" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">SPCC Cold Rolled (1.5mm - 2.0mm)</text>
        
        <text x="35" y="86" fill="#64748b" font-family="'Times New Roman', serif" font-size="10">RATING:</text>
        <text x="110" y="86" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">IP55 Weatherproof Gasket</text>
        
        <text x="35" y="100" fill="#64748b" font-family="'Times New Roman', serif" font-size="10">STATUS:</text>
        <text x="110" y="100" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">Flat Pattern Validated</text>
        

  <!-- Viewport Orientation Cube (Top Right) -->
  <g transform="translate(520, 35)">
    <polygon points="20,0 40,10 20,20 0,10" fill="none" stroke="#38bdf8" stroke-width="1"/>
    <polygon points="0,10 20,20 20,40 0,30" fill="none" stroke="#0ea5e9" stroke-width="1"/>
    <polygon points="20,20 40,10 40,30 20,40" fill="none" stroke="#0284c7" stroke-width="1"/>
    <text x="17" y="13" fill="#f8fafc" font-family="'Times New Roman', serif" font-size="8">TOP</text>
    <text x="5" y="27" fill="#f8fafc" font-family="'Times New Roman', serif" font-size="8">FRONT</text>
    <text x="25" y="27" fill="#f8fafc" font-family="'Times New Roman', serif" font-size="8">RIGHT</text>
  </g>

  <!-- Central Engineering Geometry -->
  
  <g transform="translate(300, 200)">
    <!-- Enclosure Outer Profile (Isometric / Orthogonal Folded Sheet) -->
    <rect x="-105" y="-85" width="210" height="170" rx="4" fill="none" stroke="#38bdf8" stroke-width="2.2"/>
    <!-- Inner Perimeter Seal / Gasket Land -->
    <rect x="-95" y="-75" width="190" height="150" rx="2" fill="none" stroke="#1e293b" stroke-width="1"/>

    <!-- Door Concealed Hinges (Left) -->
    <rect x="-108" y="-55" width="6" height="20" rx="1" fill="#38bdf8"/>
    <rect x="-108" y="35" width="6" height="20" rx="1" fill="#38bdf8"/>

    <!-- 3-Point Master Key Latch Handle (Right) -->
    <rect x="80" y="-10" width="10" height="25" rx="2" fill="none" stroke="#f8fafc" stroke-width="1.8"/>
    <circle cx="85" cy="0" r="3" fill="#38bdf8"/>
    <line x1="85" y1="-10" x2="85" y2="-65" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 2"/>
    <line x1="85" y1="15" x2="85" y2="65" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 2"/>

    <!-- Internal Galvanized Sub-Panel / DIN Rail Array -->
    <line x1="-75" y1="-40" x2="65" y2="-40" stroke="#0ea5e9" stroke-width="2"/>
    <line x1="-75" y1="0" x2="65" y2="0" stroke="#0ea5e9" stroke-width="2"/>
    <line x1="-75" y1="40" x2="65" y2="40" stroke="#0ea5e9" stroke-width="2"/>

    <!-- Mounted Circuit Breakers / Terminal Blocks -->
    <rect x="-65" y="-50" width="18" height="20" fill="none" stroke="#f8fafc" stroke-width="1.2"/>
    <rect x="-40" y="-50" width="18" height="20" fill="none" stroke="#f8fafc" stroke-width="1.2"/>
    <rect x="-15" y="-50" width="18" height="20" fill="none" stroke="#f8fafc" stroke-width="1.2"/>

    <!-- Bottom Cable Gland Entry Plate -->
    <rect x="-55" y="80" width="110" height="10" rx="2" fill="none" stroke="#f8fafc" stroke-width="1.5"/>
  </g>


  <!-- Lower Engineering Status Bar -->
  <rect x="28" y="328" width="544" height="24" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <circle cx="42" cy="340" r="4" fill="#10b981"/>
  <text x="52" y="343" fill="#94a3b8" font-family="'Times New Roman', serif" font-size="9">SOLIDWORKS 3D MODEL &amp; ASSEMBLY ACTIVE | VERIFIED COMPONENT TOLERANCES</text>
  <text x="460" y="343" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="9" font-weight="bold">SCALE 1:1 [METRIC]</text>
</svg>