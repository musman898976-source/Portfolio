<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <pattern id="grid-proj-11" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.7"/>
    </pattern>
    <linearGradient id="hudGrad-proj-11" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="380" fill="#090d16"/>
  <rect width="600" height="380" fill="url(#grid-proj-11)"/>

  <!-- CAD Viewport Overlay Frames -->
  <rect x="20" y="20" width="560" height="340" fill="none" stroke="#1e293b" stroke-width="1"/>
  <rect x="25" y="25" width="550" height="330" fill="none" stroke="#334155" stroke-dasharray="4 4" stroke-width="0.8"/>

  <!-- Title Block (Top Left) -->
  <rect x="28" y="28" width="220" height="70" rx="3" fill="url(#hudGrad-proj-11)" stroke="#38bdf8" stroke-width="0.8" opacity="0.9"/>
  <text x="35" y="44" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="12" font-weight="bold" letter-spacing="1">PROJ-11 // SOLIDWORKS CAD</text>
  
        <text x="35" y="58" fill="#64748b" font-family="'Times New Roman', serif" font-size="10">DISCIPLINE:</text>
        <text x="110" y="58" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">Mechanical Assemblies</text>
        
        <text x="35" y="72" fill="#64748b" font-family="'Times New Roman', serif" font-size="10">MATERIAL:</text>
        <text x="110" y="72" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">Glass-Filled Nylon &amp; ABS</text>
        
        <text x="35" y="86" fill="#64748b" font-family="'Times New Roman', serif" font-size="10">FEATURES:</text>
        <text x="110" y="86" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">High-Flow Curvature Impeller</text>
        
        <text x="35" y="100" fill="#64748b" font-family="'Times New Roman', serif" font-size="10">STATUS:</text>
        <text x="110" y="100" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">Balance &amp; Clearance Validated</text>
        

  <!-- Viewport Orientation Cube (Top Right) -->
  <g transform="translate(520, 35)">
    <polygon points="20,0 40,10 20,20 0,10" fill="none" stroke="#38bdf8" stroke-width="1"/>
    <polygon points="0,10 20,20 20,40 0,30" fill="none" stroke="#0ea5e9" stroke-width="1"/>
    <polygon points="20,20 40,10 40,30 20,40" fill="none" stroke="#0284c7" stroke-width="1"/>
    <text x="17" y="13" fill="#f8fafc" font-family="'Times New Roman', serif" font-size="8">TOP</text>
    <text x="5" y="27" fill="#f8fafc" font-family="'Times New Roman', serif" font-size="8">FRONT</text>
    <text x="25" y="27" fill="#f8fafc" font-family="'Times New Roman', serif" font-size="8">RIGHT</text>
  </g>

  <!-- Central Engineering Geometry -->
  
  <g transform="translate(300, 200)">
    <!-- Outer Cylindrical Shroud Ring -->
    <circle cx="0" cy="0" r="105" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="113" fill="none" stroke="#0ea5e9" stroke-width="1"/>
    
    <!-- Flange Mounting Eyelets (4 Corners) -->
    <circle cx="-90" cy="-90" r="6" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="-90" cy="-90" r="3" fill="#38bdf8"/>
    <circle cx="90" cy="-90" r="6" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="90" cy="-90" r="3" fill="#38bdf8"/>
    <circle cx="-90" cy="90" r="6" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="-90" cy="90" r="3" fill="#38bdf8"/>
    <circle cx="90" cy="90" r="6" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="90" cy="90" r="3" fill="#38bdf8"/>

    <!-- Outer Mounting Square Perimeter -->
    <rect x="-105" y="-105" width="210" height="210" rx="8" fill="none" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Central Motor Hub -->
    <circle cx="0" cy="0" r="35" fill="none" stroke="#f8fafc" stroke-width="2"/>
    <circle cx="0" cy="0" r="14" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="4" fill="#38bdf8"/>

    <!-- Curved Aerodynamic Airfoil Blades (7 Blades) -->
    <!-- Blade 1: Top -->
    <path d="M 0 -35 C 10 -65, 25 -85, 10 -105 C -5 -90, -10 -65, 0 -35" fill="none" stroke="#38bdf8" stroke-width="1.8"/>
    <!-- Blade 2: Top Right -->
    <path d="M 28 -21 C 58 -28, 85 -20, 95 -45 C 80 -45, 55 -38, 28 -21" fill="none" stroke="#38bdf8" stroke-width="1.8"/>
    <!-- Blade 3: Bottom Right -->
    <path d="M 33 11 C 65 20, 85 45, 80 72 C 68 62, 52 40, 33 11" fill="none" stroke="#38bdf8" stroke-width="1.8"/>
    <!-- Blade 4: Bottom -->
    <path d="M 8 34 C 10 68, 5 92, -20 102 C -18 85, -8 62, 8 34" fill="none" stroke="#38bdf8" stroke-width="1.8"/>
    <!-- Blade 5: Bottom Left -->
    <path d="M -25 24 C -55 42, -75 58, -95 42 C -80 32, -60 22, -25 24" fill="none" stroke="#38bdf8" stroke-width="1.8"/>
    <!-- Blade 6: Top Left -->
    <path d="M -33 -11 C -68 -5, -92 -20, -98 -48 C -82 -40, -60 -25, -33 -11" fill="none" stroke="#38bdf8" stroke-width="1.8"/>
    <!-- Blade 7: Upper Left Arc -->
    <path d="M -15 -31 C -35 -58, -45 -82, -40 -100 C -30 -82, -22 -60, -15 -31" fill="none" stroke="#38bdf8" stroke-width="1.8"/>

    <!-- Rotation Direction Indicator Arrow -->
    <path d="M 45 -45 A 65 65 0 0 1 65 0" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3 2"/>
    <polygon points="65,-3 70,5 60,3" fill="#ef4444"/>
    <text x="72" y="-12" fill="#ef4444" font-family="'Times New Roman', serif" font-size="8">CW ROTATION</text>
  </g>


  <!-- Lower Engineering Status Bar -->
  <rect x="28" y="328" width="544" height="24" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <circle cx="42" cy="340" r="4" fill="#10b981"/>
  <text x="52" y="343" fill="#94a3b8" font-family="'Times New Roman', serif" font-size="9">SOLIDWORKS 3D MODEL &amp; ASSEMBLY ACTIVE | VERIFIED COMPONENT TOLERANCES</text>
  <text x="460" y="343" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="9" font-weight="bold">SCALE 1:1 [METRIC]</text>
</svg>