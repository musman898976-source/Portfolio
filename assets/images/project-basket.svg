<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <pattern id="grid-proj-08" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.7"/>
    </pattern>
    <linearGradient id="hudGrad-proj-08" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="380" fill="#090d16"/>
  <rect width="600" height="380" fill="url(#grid-proj-08)"/>

  <!-- CAD Viewport Overlay Frames -->
  <rect x="20" y="20" width="560" height="340" fill="none" stroke="#1e293b" stroke-width="1"/>
  <rect x="25" y="25" width="550" height="330" fill="none" stroke="#334155" stroke-dasharray="4 4" stroke-width="0.8"/>

  <!-- Title Block (Top Left) -->
  <rect x="28" y="28" width="220" height="70" rx="3" fill="url(#hudGrad-proj-08)" stroke="#38bdf8" stroke-width="0.8" opacity="0.9"/>
  <text x="35" y="44" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="12" font-weight="bold" letter-spacing="1">PROJ-08 // SOLIDWORKS CAD</text>
  
        <text x="35" y="58" fill="#64748b" font-family="'Times New Roman', serif" font-size="10">DISCIPLINE:</text>
        <text x="110" y="58" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">Product Design</text>
        
        <text x="35" y="72" fill="#64748b" font-family="'Times New Roman', serif" font-size="10">MATERIAL:</text>
        <text x="110" y="72" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">Polypropylene (PP)</text>
        
        <text x="35" y="86" fill="#64748b" font-family="'Times New Roman', serif" font-size="10">TOOLING:</text>
        <text x="110" y="86" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">Injection Mold Texture Core</text>
        
        <text x="35" y="100" fill="#64748b" font-family="'Times New Roman', serif" font-size="10">STATUS:</text>
        <text x="110" y="100" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">Draft &amp; Ejection Verified</text>
        

  <!-- Viewport Orientation Cube (Top Right) -->
  <g transform="translate(520, 35)">
    <polygon points="20,0 40,10 20,20 0,10" fill="none" stroke="#38bdf8" stroke-width="1"/>
    <polygon points="0,10 20,20 20,40 0,30" fill="none" stroke="#0ea5e9" stroke-width="1"/>
    <polygon points="20,20 40,10 40,30 20,40" fill="none" stroke="#0284c7" stroke-width="1"/>
    <text x="17" y="13" fill="#f8fafc" font-family="'Times New Roman', serif" font-size="8">TOP</text>
    <text x="5" y="27" fill="#f8fafc" font-family="'Times New Roman', serif" font-size="8">FRONT</text>
    <text x="25" y="27" fill="#f8fafc" font-family="'Times New Roman', serif" font-size="8">RIGHT</text>
  </g>

  <!-- Central Engineering Geometry -->
  
  <g transform="translate(300, 200)">
    <!-- Top Rim Oval -->
    <ellipse cx="0" cy="-60" rx="120" ry="24" fill="none" stroke="#38bdf8" stroke-width="2.2"/>
    <ellipse cx="0" cy="-60" rx="110" ry="19" fill="none" stroke="#0ea5e9" stroke-width="1.4"/>

    <!-- Basket Body Contour Profile -->
    <path d="M -120 -60 C -130 10, -95 65, -75 75 L 75 75 C 95 65, 130 10, 120 -60" 
          fill="none" stroke="#38bdf8" stroke-width="2"/>

    <!-- Bottom Rim Oval -->
    <ellipse cx="0" cy="75" rx="75" ry="14" fill="none" stroke="#0ea5e9" stroke-width="1.8"/>

    <!-- Woven Diagonal Interlacing Pattern (Diamond Matrix) -->
    <g stroke="#94a3b8" stroke-width="1" opacity="0.8">
      <path d="M -110 -50 Q -70 10, -50 75"/>
      <path d="M -80 -55 Q -40 10, -20 76"/>
      <path d="M -50 -58 Q -10 10, 10 76"/>
      <path d="M -20 -60 Q 20 10, 40 75"/>
      <path d="M 10 -60 Q 50 10, 70 73"/>

      <!-- Reverse Diagonal Weave -->
      <path d="M 110 -50 Q 70 10, 50 75"/>
      <path d="M 80 -55 Q 40 10, 20 76"/>
      <path d="M 50 -58 Q 10 10, -10 76"/>
      <path d="M 20 -60 Q -20 10, -40 75"/>
      <path d="M -10 -60 Q -50 10, -70 73"/>
    </g>

    <!-- Side Handles -->
    <path d="M -122 -55 C -140 -55, -140 -35, -121 -35" fill="none" stroke="#f8fafc" stroke-width="2"/>
    <path d="M 122 -55 C 140 -55, 140 -35, 121 -35" fill="none" stroke="#f8fafc" stroke-width="2"/>

    <text x="-65" y="105" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="9">TEXTURED INJECTION MOLD CORE</text>
  </g>


  <!-- Lower Engineering Status Bar -->
  <rect x="28" y="328" width="544" height="24" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <circle cx="42" cy="340" r="4" fill="#10b981"/>
  <text x="52" y="343" fill="#94a3b8" font-family="'Times New Roman', serif" font-size="9">SOLIDWORKS 3D MODEL &amp; ASSEMBLY ACTIVE | VERIFIED COMPONENT TOLERANCES</text>
  <text x="460" y="343" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="9" font-weight="bold">SCALE 1:1 [METRIC]</text>
</svg>