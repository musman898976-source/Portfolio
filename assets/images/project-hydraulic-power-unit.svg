<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <pattern id="grid-proj-37" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.7"/>
    </pattern>
    <linearGradient id="hudGrad-proj-37" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="380" fill="#090d16"/>
  <rect width="600" height="380" fill="url(#grid-proj-37)"/>

  <!-- CAD Viewport Overlay Frames -->
  <rect x="20" y="20" width="560" height="340" fill="none" stroke="#1e293b" stroke-width="1"/>
  <rect x="25" y="25" width="550" height="330" fill="none" stroke="#334155" stroke-dasharray="4 4" stroke-width="0.8"/>

  <!-- Title Block (Top Left) -->
  <rect x="28" y="28" width="220" height="70" rx="3" fill="url(#hudGrad-proj-37)" stroke="#38bdf8" stroke-width="0.8" opacity="0.9"/>
  <text x="35" y="44" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="12" font-weight="bold" letter-spacing="1">PROJ-37 // SOLIDWORKS CAD</text>
  
        <text x="35" y="58" fill="#64748b" font-family="'Times New Roman', serif" font-size="10">DISCIPLINE:</text>
        <text x="110" y="58" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">Hydraulic Systems</text>
        
        <text x="35" y="72" fill="#64748b" font-family="'Times New Roman', serif" font-size="10">MATERIAL:</text>
        <text x="110" y="72" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">Welded Steel Tank &amp; Manifold</text>
        
        <text x="35" y="86" fill="#64748b" font-family="'Times New Roman', serif" font-size="10">SYSTEM:</text>
        <text x="110" y="86" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">Motor Pump &amp; Solenoid Stack</text>
        
        <text x="35" y="100" fill="#64748b" font-family="'Times New Roman', serif" font-size="10">STATUS:</text>
        <text x="110" y="100" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">Skid Layout Approved</text>
        

  <!-- Viewport Orientation Cube (Top Right) -->
  <g transform="translate(520, 35)">
    <polygon points="20,0 40,10 20,20 0,10" fill="none" stroke="#38bdf8" stroke-width="1"/>
    <polygon points="0,10 20,20 20,40 0,30" fill="none" stroke="#0ea5e9" stroke-width="1"/>
    <polygon points="20,20 40,10 40,30 20,40" fill="none" stroke="#0284c7" stroke-width="1"/>
    <text x="17" y="13" fill="#f8fafc" font-family="'Times New Roman', serif" font-size="8">TOP</text>
    <text x="5" y="27" fill="#f8fafc" font-family="'Times New Roman', serif" font-size="8">FRONT</text>
    <text x="25" y="27" fill="#f8fafc" font-family="'Times New Roman', serif" font-size="8">RIGHT</text>
  </g>

  <!-- Central Engineering Geometry -->
  
  <g transform="translate(300, 205)">
    <!-- Welded Hydraulic Fluid Reservoir Tank -->
    <rect x="-120" y="0" width="240" height="75" rx="4" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <!-- Fluid Level / Temp Sight Gauge (Front Right) -->
    <rect x="75" y="15" width="12" height="40" rx="2" fill="none" stroke="#10b981" stroke-width="1.5"/>
    <line x1="81" y1="20" x2="81" y2="50" stroke="#10b981" stroke-width="2"/>

    <!-- Top Tank Cover Plate -->
    <rect x="-125" y="-6" width="250" height="12" rx="2" fill="none" stroke="#f8fafc" stroke-width="1.8"/>

    <!-- Electric Motor & Bellhousing Flange (Left Top) -->
    <rect x="-95" y="-85" width="65" height="55" rx="3" fill="none" stroke="#0ea5e9" stroke-width="1.8"/>
    <rect x="-85" y="-30" width="45" height="24" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="-63" y1="-6" x2="-63" y2="45" stroke="#94a3b8" stroke-width="3" stroke-dasharray="3 2"/>

    <!-- Hydraulic Manifold Block with Solenoid Valves (Right Top) -->
    <rect x="0" y="-45" width="60" height="40" rx="2" fill="none" stroke="#f8fafc" stroke-width="1.8"/>
    <rect x="5" y="-65" width="22" height="20" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="33" y="-65" width="22" height="20" fill="none" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- Pressure Gauge on Manifold -->
    <circle cx="30" cy="-80" r="10" fill="none" stroke="#ef4444" stroke-width="1.4"/>
    <line x1="30" y1="-70" x2="30" y2="-45" stroke="#94a3b8" stroke-width="1.5"/>
  </g>


  <!-- Lower Engineering Status Bar -->
  <rect x="28" y="328" width="544" height="24" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <circle cx="42" cy="340" r="4" fill="#10b981"/>
  <text x="52" y="343" fill="#94a3b8" font-family="'Times New Roman', serif" font-size="9">SOLIDWORKS 3D MODEL &amp; ASSEMBLY ACTIVE | VERIFIED COMPONENT TOLERANCES</text>
  <text x="460" y="343" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="9" font-weight="bold">SCALE 1:1 [METRIC]</text>
</svg>