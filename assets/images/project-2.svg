  <path d="M 570 20 L 580 20 L 580 30" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <path d="M 30 360 L 20 360 L 20 350" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <path d="M 570 360 L 580 360 L 580 350" fill="none" stroke="#38bdf8" stroke-width="2"/>

  <!-- Header HUD Tag -->
  <text x="35" y="42" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1.5">DEMO-02 // GANTRY-XYZ</text>
  <text x="35" y="58" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="13">3-AXIS PICK &amp; PLACE GANTRY</text>
  <text x="565" y="42" text-anchor="end" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="9" letter-spacing="1">DEMO SCHEMATIC // DRAFT</text>
  <line x1="35" y1="68" x2="565" y2="68" stroke="#1e293b" stroke-width="1"/>

  <!-- Main CAD Vector Graphic -->
  <g id="geometry">
    <rect x="80" y="100" width="440" height="20" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/><rect x="80" y="280" width="440" height="20" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/><rect x="200" y="110" width="40" height="180" fill="none" stroke="#38bdf8" stroke-width="2"/><circle cx="220" cy="200" r="18" fill="none" stroke="#f59e0b" stroke-width="2"/><line x1="220" y1="170" x2="220" y2="250" stroke="#38bdf8" stroke-width="2"/><rect x="210" y="240" width="20" height="30" fill="#2563eb" stroke="#38bdf8"/><circle cx="215" cy="275" r="4" fill="#38bdf8"/><circle cx="225" cy="275" r="4" fill="#38bdf8"/><path d="M 120 110 L 140 110 L 130 95 Z" fill="#38bdf8"/><text x="245" y="195" fill="#94a3b8" font-family="monospace" font-size="10">Z-HEAD ACTUATOR (+/- 0.02 mm)</text><line x1="80" y1="75" x2="520" y2="75" stroke="#94a3b8" stroke-width="1"/><text x="260" y="70" fill="#94a3b8" font-family="monospace" font-size="11">STROKE: 650 mm</text>
  </g>

