<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <pattern id="grid-proj-03" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.7"/>
    </pattern>
    <linearGradient id="hudGrad-proj-03" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="380" fill="#090d16"/>
  <rect width="600" height="380" fill="url(#grid-proj-03)"/>

  <!-- CAD Viewport Overlay Frames -->
  <rect x="20" y="20" width="560" height="340" fill="none" stroke="#1e293b" stroke-width="1"/>
  <rect x="25" y="25" width="550" height="330" fill="none" stroke="#334155" stroke-dasharray="4 4" stroke-width="0.8"/>

  <!-- Title Block (Top Left) -->
  <rect x="28" y="28" width="220" height="70" rx="3" fill="url(#hudGrad-proj-03)" stroke="#38bdf8" stroke-width="0.8" opacity="0.9"/>
  <text x="35" y="44" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="12" font-weight="bold" letter-spacing="1">PROJ-03 // SOLIDWORKS CAD</text>
  
        <text x="35" y="58" fill="#64748b" font-family="'Times New Roman', serif" font-size="10">DISCIPLINE:</text>
        <text x="110" y="58" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">Industrial Equipment</text>
        
        <text x="35" y="72" fill="#64748b" font-family="'Times New Roman', serif" font-size="10">MATERIAL:</text>
        <text x="110" y="72" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">SS 304 &amp; Structural Steel</text>
        
        <text x="35" y="86" fill="#64748b" font-family="'Times New Roman', serif" font-size="10">PROCESS:</text>
        <text x="110" y="86" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">ASME Welded Construction</text>
        
        <text x="35" y="100" fill="#64748b" font-family="'Times New Roman', serif" font-size="10">STATUS:</text>
        <text x="110" y="100" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">Skid Layout Approved</text>
        

  <!-- Viewport Orientation Cube (Top Right) -->
  <g transform="translate(520, 35)">
    <polygon points="20,0 40,10 20,20 0,10" fill="none" stroke="#38bdf8" stroke-width="1"/>
    <polygon points="0,10 20,20 20,40 0,30" fill="none" stroke="#0ea5e9" stroke-width="1"/>
    <polygon points="20,20 40,10 40,30 20,40" fill="none" stroke="#0284c7" stroke-width="1"/>
    <text x="17" y="13" fill="#f8fafc" font-family="'Times New Roman', serif" font-size="8">TOP</text>
    <text x="5" y="27" fill="#f8fafc" font-family="'Times New Roman', serif" font-size="8">FRONT</text>
    <text x="25" y="27" fill="#f8fafc" font-family="'Times New Roman', serif" font-size="8">RIGHT</text>
  </g>

  <!-- Central Engineering Geometry -->
  
  <g transform="translate(300, 200)">
    <!-- Main Outer Shell / Frame Structure -->
    <rect x="-140" y="-70" width="280" height="140" rx="8" fill="none" stroke="#38bdf8" stroke-width="1.8"/>
    <rect x="-148" y="-76" width="296" height="152" rx="12" fill="none" stroke="#1e293b" stroke-width="1"/>
    
    <!-- End Flanges -->
    <rect x="-155" y="-80" width="15" height="160" rx="2" fill="none" stroke="#0ea5e9" stroke-width="1.5"/>
    <rect x="140" y="-80" width="15" height="160" rx="2" fill="none" stroke="#0ea5e9" stroke-width="1.5"/>

    <!-- Inlet / Outlet Nozzles -->
    <!-- Top Hot Inlet -->
    <rect x="-90" y="-105" width="35" height="35" fill="none" stroke="#ef4444" stroke-width="1.5"/>
    <line x1="-72" y1="-115" x2="-72" y2="-70" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="4 2"/>
    <text x="-88" y="-112" fill="#ef4444" font-family="'Times New Roman', serif" font-size="9">INLET T1</text>

    <!-- Top Cold Outlet -->
    <rect x="55" y="-105" width="35" height="35" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="72" y1="-115" x2="72" y2="-70" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="4 2"/>
    <text x="57" y="-112" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="9">OUTLET T2</text>

    <!-- Internal Parallel Plate Channels / Tube Bundle -->
    <g stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 2">
      <line x1="-120" y1="-50" x2="120" y2="-50"/>
      <line x1="-120" y1="-30" x2="120" y2="-30"/>
      <line x1="-120" y1="-10" x2="120" y2="-10"/>
      <line x1="-120" y1="10" x2="120" y2="10"/>
      <line x1="-120" y1="30" x2="120" y2="30"/>
      <line x1="-120" y1="50" x2="120" y2="50"/>
    </g>

    <!-- Vertical Baffles -->
    <line x1="-50" y1="-70" x2="-50" y2="30" stroke="#0ea5e9" stroke-width="2"/>
    <line x1="0" y1="-30" x2="0" y2="70" stroke="#0ea5e9" stroke-width="2"/>
    <line x1="50" y1="-70" x2="50" y2="30" stroke="#0ea5e9" stroke-width="2"/>

    <!-- Support Base / Saddle Mounts -->
    <polygon points="-110,70 -90,95 -130,95" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <polygon points="110,70 130,95 90,95" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="-150" y1="95" x2="150" y2="95" stroke="#64748b" stroke-width="1.5"/>
  </g>


  <!-- Lower Engineering Status Bar -->
  <rect x="28" y="328" width="544" height="24" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <circle cx="42" cy="340" r="4" fill="#10b981"/>
  <text x="52" y="343" fill="#94a3b8" font-family="'Times New Roman', serif" font-size="9">SOLIDWORKS 3D MODEL &amp; ASSEMBLY ACTIVE | VERIFIED COMPONENT TOLERANCES</text>
  <text x="460" y="343" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="9" font-weight="bold">SCALE 1:1 [METRIC]</text>
</svg>