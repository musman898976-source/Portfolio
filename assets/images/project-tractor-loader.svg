<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <pattern id="grid-proj-22" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.7"/>
    </pattern>
    <linearGradient id="hudGrad-proj-22" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="380" fill="#090d16"/>
  <rect width="600" height="380" fill="url(#grid-proj-22)"/>

  <!-- CAD Viewport Overlay Frames -->
  <rect x="20" y="20" width="560" height="340" fill="none" stroke="#1e293b" stroke-width="1"/>
  <rect x="25" y="25" width="550" height="330" fill="none" stroke="#334155" stroke-dasharray="4 4" stroke-width="0.8"/>

  <!-- Title Block (Top Left) -->
  <rect x="28" y="28" width="220" height="70" rx="3" fill="url(#hudGrad-proj-22)" stroke="#38bdf8" stroke-width="0.8" opacity="0.9"/>
  <text x="35" y="44" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="12" font-weight="bold" letter-spacing="1">PROJ-22 // SOLIDWORKS CAD</text>
  
        <text x="35" y="58" fill="#64748b" font-family="'Times New Roman', serif" font-size="10">DISCIPLINE:</text>
        <text x="110" y="58" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">Agricultural Machinery</text>
        
        <text x="35" y="72" fill="#64748b" font-family="'Times New Roman', serif" font-size="10">MATERIAL:</text>
        <text x="110" y="72" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">Structural St52-3 &amp; Alloy Pins</text>
        
        <text x="35" y="86" fill="#64748b" font-family="'Times New Roman', serif" font-size="10">SOFTWARE:</text>
        <text x="110" y="86" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">SolidWorks Assembly &amp; Kinematics</text>
        
        <text x="35" y="100" fill="#64748b" font-family="'Times New Roman', serif" font-size="10">STATUS:</text>
        <text x="110" y="100" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">Kinematic Linkage Verified</text>
        

  <!-- Viewport Orientation Cube (Top Right) -->
  <g transform="translate(520, 35)">
    <polygon points="20,0 40,10 20,20 0,10" fill="none" stroke="#38bdf8" stroke-width="1"/>
    <polygon points="0,10 20,20 20,40 0,30" fill="none" stroke="#0ea5e9" stroke-width="1"/>
    <polygon points="20,20 40,10 40,30 20,40" fill="none" stroke="#0284c7" stroke-width="1"/>
    <text x="17" y="13" fill="#f8fafc" font-family="'Times New Roman', serif" font-size="8">TOP</text>
    <text x="5" y="27" fill="#f8fafc" font-family="'Times New Roman', serif" font-size="8">FRONT</text>
    <text x="25" y="27" fill="#f8fafc" font-family="'Times New Roman', serif" font-size="8">RIGHT</text>
  </g>

  <!-- Central Engineering Geometry -->
  
  <g transform="translate(300, 210)">
    <!-- Tractor Rear Wheel (Large) & Front Wheel (Smaller) -->
    <circle cx="-100" cy="50" r="38" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <circle cx="-100" cy="50" r="18" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="-5" cy="62" r="24" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="-5" cy="62" r="12" fill="none" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Tractor Hood & Chassis -->
    <path d="M -130 50 L -130 0 L -60 -5 L -60 -45 L 20 -45 L 25 50 Z" fill="none" stroke="#0ea5e9" stroke-width="1.8"/>

    <!-- Loader Subframe Upright Mount (Tractor Mid-Mount) -->
    <rect x="-45" y="-15" width="20" height="70" fill="none" stroke="#f8fafc" stroke-width="2"/>
    <circle cx="-35" cy="-5" r="5" fill="#38bdf8"/>

    <!-- Curved Loader Lift Arm Linkage -->
    <path d="M -35 -5 L 30 -55 L 105 25" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="30" cy="-55" r="6" fill="#090d16" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="105" cy="25" r="5" fill="#090d16" stroke="#38bdf8" stroke-width="2"/>

    <!-- Hydraulic Lift Cylinder -->
    <line x1="-35" y1="20" x2="35" y2="-40" stroke="#94a3b8" stroke-width="3"/>

    <!-- Quick-Attach Agricultural Loader Bucket -->
    <path d="M 105 25 L 125 0 L 155 55 L 115 65 Z" fill="none" stroke="#f8fafc" stroke-width="2.2" stroke-linejoin="round"/>
    <polygon points="155,55 165,58 152,62" fill="#38bdf8"/>
    <!-- Bucket Dump Hydraulic Cylinder -->
    <line x1="60" y1="-25" x2="115" y2="10" stroke="#0ea5e9" stroke-width="2"/>
  </g>


  <!-- Lower Engineering Status Bar -->
  <rect x="28" y="328" width="544" height="24" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <circle cx="42" cy="340" r="4" fill="#10b981"/>
  <text x="52" y="343" fill="#94a3b8" font-family="'Times New Roman', serif" font-size="9">SOLIDWORKS 3D MODEL &amp; ASSEMBLY ACTIVE | VERIFIED COMPONENT TOLERANCES</text>
  <text x="460" y="343" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="9" font-weight="bold">SCALE 1:1 [METRIC]</text>
</svg>