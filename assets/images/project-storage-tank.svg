<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <pattern id="grid-proj-48" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.7"/>
    </pattern>
    <linearGradient id="hudGrad-proj-48" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="380" fill="#090d16"/>
  <rect width="600" height="380" fill="url(#grid-proj-48)"/>

  <!-- CAD Viewport Overlay Frames -->
  <rect x="20" y="20" width="560" height="340" fill="none" stroke="#1e293b" stroke-width="1"/>
  <rect x="25" y="25" width="550" height="330" fill="none" stroke="#334155" stroke-dasharray="4 4" stroke-width="0.8"/>

  <!-- Title Block (Top Left) -->
  <rect x="28" y="28" width="220" height="70" rx="3" fill="url(#hudGrad-proj-48)" stroke="#38bdf8" stroke-width="0.8" opacity="0.9"/>
  <text x="35" y="44" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="12" font-weight="bold" letter-spacing="1">PROJ-48 // SOLIDWORKS CAD</text>
  
        <text x="35" y="58" fill="#64748b" font-family="'Times New Roman', serif" font-size="10">DISCIPLINE:</text>
        <text x="110" y="58" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">Process Equipment</text>
        
        <text x="35" y="72" fill="#64748b" font-family="'Times New Roman', serif" font-size="10">MATERIAL:</text>
        <text x="110" y="72" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">Stainless Steel 304 (6mm Shell)</text>
        
        <text x="35" y="86" fill="#64748b" font-family="'Times New Roman', serif" font-size="10">STANDARD:</text>
        <text x="110" y="86" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">API 650 / ASME Welded Vessel</text>
        
        <text x="35" y="100" fill="#64748b" font-family="'Times New Roman', serif" font-size="10">STATUS:</text>
        <text x="110" y="100" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">Hydrostatic Head Rated</text>
        

  <!-- Viewport Orientation Cube (Top Right) -->
  <g transform="translate(520, 35)">
    <polygon points="20,0 40,10 20,20 0,10" fill="none" stroke="#38bdf8" stroke-width="1"/>
    <polygon points="0,10 20,20 20,40 0,30" fill="none" stroke="#0ea5e9" stroke-width="1"/>
    <polygon points="20,20 40,10 40,30 20,40" fill="none" stroke="#0284c7" stroke-width="1"/>
    <text x="17" y="13" fill="#f8fafc" font-family="'Times New Roman', serif" font-size="8">TOP</text>
    <text x="5" y="27" fill="#f8fafc" font-family="'Times New Roman', serif" font-size="8">FRONT</text>
    <text x="25" y="27" fill="#f8fafc" font-family="'Times New Roman', serif" font-size="8">RIGHT</text>
  </g>

  <!-- Central Engineering Geometry -->
  
  <g transform="translate(300, 200)">
    <!-- Vertical Cylindrical Tank Shell -->
    <rect x="-85" y="-55" width="170" height="115" fill="none" stroke="#38bdf8" stroke-width="2"/>

    <!-- Top Dished Torispherical Head -->
    <path d="M -85 -55 C -85 -85, 85 -85, 85 -55" fill="none" stroke="#0ea5e9" stroke-width="2"/>
    <!-- Bottom Dished Head / Conical Drain -->
    <path d="M -85 60 C -85 85, 85 85, 85 60" fill="none" stroke="#0ea5e9" stroke-width="2"/>
    <rect x="-8" y="78" width="16" height="15" fill="none" stroke="#f8fafc" stroke-width="1.5"/>

    <!-- Top Inspection Manway with Bolted Cover -->
    <rect x="-25" y="-95" width="50" height="15" rx="2" fill="none" stroke="#f8fafc" stroke-width="1.8"/>
    <circle cx="-15" cy="-88" r="2" fill="#38bdf8"/>
    <circle cx="15" cy="-88" r="2" fill="#38bdf8"/>

    <!-- Structural Pipe Support Legs (4 Legs with Baseplates) -->
    <line x1="-75" y1="50" x2="-75" y2="105" stroke="#38bdf8" stroke-width="3"/>
    <rect x="-85" y="105" width="20" height="5" fill="#38bdf8"/>
    <line x1="75" y1="50" x2="75" y2="105" stroke="#38bdf8" stroke-width="3"/>
    <rect x="65" y="105" width="20" height="5" fill="#38bdf8"/>

    <!-- Liquid Level Sight Glass / Level Transmitter Flanges -->
    <line x1="90" y1="-30" x2="90" y2="40" stroke="#10b981" stroke-width="2"/>
    <rect x="85" y="-35" width="10" height="6" fill="#10b981"/>
    <rect x="85" y="40" width="10" height="6" fill="#10b981"/>
  </g>


  <!-- Lower Engineering Status Bar -->
  <rect x="28" y="328" width="544" height="24" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <circle cx="42" cy="340" r="4" fill="#10b981"/>
  <text x="52" y="343" fill="#94a3b8" font-family="'Times New Roman', serif" font-size="9">SOLIDWORKS 3D MODEL &amp; ASSEMBLY ACTIVE | VERIFIED COMPONENT TOLERANCES</text>
  <text x="460" y="343" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="9" font-weight="bold">SCALE 1:1 [METRIC]</text>
</svg>