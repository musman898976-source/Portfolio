      <rect x="-106" y="-27" width="16" height="14" rx="2"/>
      <rect x="-86" y="-27" width="16" height="14" rx="2"/>
      <rect x="-66" y="-27" width="16" height="14" rx="2"/>
      <rect x="-46" y="-27" width="16" height="14" rx="2"/>
      <rect x="-26" y="-27" width="16" height="14" rx="2"/>
      <rect x="-6" y="-27" width="16" height="14" rx="2"/>
      <rect x="14" y="-27" width="16" height="14" rx="2"/>
      <rect x="34" y="-27" width="16" height="14" rx="2"/>
      <rect x="54" y="-27" width="16" height="14" rx="2"/>
      <rect x="74" y="-27" width="16" height="14" rx="2"/>
      <rect x="94" y="-27" width="16" height="14" rx="2"/>
      <rect x="114" y="-27" width="20" height="14" rx="2"/>
    </g>

    <!-- Row 3: ASDF -->
    <g fill="none" stroke="#94a3b8" stroke-width="1">
      <rect x="-135" y="-9" width="26" height="14" rx="2" stroke="#38bdf8"/>
      <rect x="-105" y="-9" width="16" height="14" rx="2"/>
      <rect x="-85" y="-9" width="16" height="14" rx="2"/>
      <rect x="-65" y="-9" width="16" height="14" rx="2"/>
      <rect x="-45" y="-9" width="16" height="14" rx="2"/>
      <rect x="-25" y="-9" width="16" height="14" rx="2"/>
      <rect x="-5" y="-9" width="16" height="14" rx="2"/>
      <rect x="15" y="-9" width="16" height="14" rx="2"/>
      <rect x="35" y="-9" width="16" height="14" rx="2"/>
      <rect x="55" y="-9" width="16" height="14" rx="2"/>
      <rect x="75" y="-9" width="16" height="14" rx="2"/>
      <rect x="95" y="-9" width="41" height="14" rx="2" stroke="#38bdf8"/>
    </g>

    <!-- Row 4: Spacebar & Modifiers -->
    <g fill="none" stroke="#38bdf8" stroke-width="1.4">
      <rect x="-140" y="10" width="30" height="16" rx="2"/>
      <rect x="-106" y="10" width="18" height="16" rx="2"/>
      <rect x="-84" y="10" width="18" height="16" rx="2"/>
