<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <pattern id="grid-proj-42" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.7"/>
    </pattern>
    <linearGradient id="hudGrad-proj-42" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="380" fill="#090d16"/>
  <rect width="600" height="380" fill="url(#grid-proj-42)"/>

  <!-- CAD Viewport Overlay Frames -->
  <rect x="20" y="20" width="560" height="340" fill="none" stroke="#1e293b" stroke-width="1"/>
  <rect x="25" y="25" width="550" height="330" fill="none" stroke="#334155" stroke-dasharray="4 4" stroke-width="0.8"/>

  <!-- Title Block (Top Left) -->
  <rect x="28" y="28" width="220" height="70" rx="3" fill="url(#hudGrad-proj-42)" stroke="#38bdf8" stroke-width="0.8" opacity="0.9"/>
  <text x="35" y="44" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="12" font-weight="bold" letter-spacing="1">PROJ-42 // SOLIDWORKS CAD</text>
  
        <text x="35" y="58" fill="#64748b" font-family="'Times New Roman', serif" font-size="10">DISCIPLINE:</text>
        <text x="110" y="58" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">Hydraulic Systems</text>
        
        <text x="35" y="72" fill="#64748b" font-family="'Times New Roman', serif" font-size="10">MATERIAL:</text>
        <text x="110" y="72" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">Honed DOM Tube &amp; Hard Chrome Rod</text>
        
        <text x="35" y="86" fill="#64748b" font-family="'Times New Roman', serif" font-size="10">PRESSURE:</text>
        <text x="110" y="86" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">250 Bar Heavy Duty</text>
        
        <text x="35" y="100" fill="#64748b" font-family="'Times New Roman', serif" font-size="10">STATUS:</text>
        <text x="110" y="100" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">Burst &amp; Seal Validated</text>
        

  <!-- Viewport Orientation Cube (Top Right) -->
  <g transform="translate(520, 35)">
    <polygon points="20,0 40,10 20,20 0,10" fill="none" stroke="#38bdf8" stroke-width="1"/>
    <polygon points="0,10 20,20 20,40 0,30" fill="none" stroke="#0ea5e9" stroke-width="1"/>
    <polygon points="20,20 40,10 40,30 20,40" fill="none" stroke="#0284c7" stroke-width="1"/>
    <text x="17" y="13" fill="#f8fafc" font-family="'Times New Roman', serif" font-size="8">TOP</text>
    <text x="5" y="27" fill="#f8fafc" font-family="'Times New Roman', serif" font-size="8">FRONT</text>
    <text x="25" y="27" fill="#f8fafc" font-family="'Times New Roman', serif" font-size="8">RIGHT</text>
  </g>

  <!-- Central Engineering Geometry -->
  
  <g transform="translate(300, 200)">
    <!-- Main Honed Cylinder Barrel -->
    <rect x="-85" y="-35" width="170" height="70" rx="3" fill="none" stroke="#38bdf8" stroke-width="2"/>

    <!-- Internal Piston Head & Polyurethane Seals -->
    <rect x="-30" y="-33" width="35" height="66" fill="none" stroke="#f8fafc" stroke-width="2"/>
    <line x1="-20" y1="-33" x2="-20" y2="33" stroke="#ef4444" stroke-width="2"/>
    <line x1="-8" y1="-33" x2="-8" y2="33" stroke="#ef4444" stroke-width="2"/>

    <!-- Hard Chrome-Plated Piston Rod Extending Right -->
    <rect x="5" y="-15" width="130" height="30" fill="none" stroke="#f8fafc" stroke-width="2"/>
    
    <!-- Front Gland Retainer / Rod Seals & Wiper -->
    <rect x="65" y="-35" width="20" height="70" rx="2" fill="none" stroke="#0ea5e9" stroke-width="1.8"/>

    <!-- Rear Blind Cap & Rear Clevis Mounting Lug -->
    <rect x="-105" y="-35" width="20" height="70" rx="2" fill="none" stroke="#0ea5e9" stroke-width="1.8"/>
    <circle cx="-120" cy="0" r="15" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="-120" cy="0" r="7" fill="#38bdf8"/>

    <!-- Rod End Clevis Mounting Eye -->
    <circle cx="150" cy="0" r="15" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="150" cy="0" r="7" fill="#38bdf8"/>

    <!-- Hydraulic Fluid SAE Ports (A and B) -->
    <rect x="-70" y="-52" width="18" height="17" fill="none" stroke="#10b981" stroke-width="1.5"/>
    <rect x="40" y="-52" width="18" height="17" fill="none" stroke="#10b981" stroke-width="1.5"/>
  </g>


  <!-- Lower Engineering Status Bar -->
  <rect x="28" y="328" width="544" height="24" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <circle cx="42" cy="340" r="4" fill="#10b981"/>
  <text x="52" y="343" fill="#94a3b8" font-family="'Times New Roman', serif" font-size="9">SOLIDWORKS 3D MODEL &amp; ASSEMBLY ACTIVE | VERIFIED COMPONENT TOLERANCES</text>
  <text x="460" y="343" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="9" font-weight="bold">SCALE 1:1 [METRIC]</text>
</svg>