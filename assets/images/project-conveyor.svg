<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <pattern id="grid-proj-10" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.7"/>
    </pattern>
    <linearGradient id="hudGrad-proj-10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="380" fill="#090d16"/>
  <rect width="600" height="380" fill="url(#grid-proj-10)"/>

  <!-- CAD Viewport Overlay Frames -->
  <rect x="20" y="20" width="560" height="340" fill="none" stroke="#1e293b" stroke-width="1"/>
  <rect x="25" y="25" width="550" height="330" fill="none" stroke="#334155" stroke-dasharray="4 4" stroke-width="0.8"/>

  <!-- Title Block (Top Left) -->
  <rect x="28" y="28" width="220" height="70" rx="3" fill="url(#hudGrad-proj-10)" stroke="#38bdf8" stroke-width="0.8" opacity="0.9"/>
  <text x="35" y="44" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="12" font-weight="bold" letter-spacing="1">PROJ-10 // SOLIDWORKS CAD</text>
  
        <text x="35" y="58" fill="#64748b" font-family="'Times New Roman', serif" font-size="10">DISCIPLINE:</text>
        <text x="110" y="58" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">Industrial Equipment</text>
        
        <text x="35" y="72" fill="#64748b" font-family="'Times New Roman', serif" font-size="10">MATERIAL:</text>
        <text x="110" y="72" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">Mild Steel Frame &amp; SS 304 Contact</text>
        
        <text x="35" y="86" fill="#64748b" font-family="'Times New Roman', serif" font-size="10">SYSTEM:</text>
        <text x="110" y="86" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">Modular Belt &amp; Enclosed Station</text>
        
        <text x="35" y="100" fill="#64748b" font-family="'Times New Roman', serif" font-size="10">STATUS:</text>
        <text x="110" y="100" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">Assembly Layout Approved</text>
        

  <!-- Viewport Orientation Cube (Top Right) -->
  <g transform="translate(520, 35)">
    <polygon points="20,0 40,10 20,20 0,10" fill="none" stroke="#38bdf8" stroke-width="1"/>
    <polygon points="0,10 20,20 20,40 0,30" fill="none" stroke="#0ea5e9" stroke-width="1"/>
    <polygon points="20,20 40,10 40,30 20,40" fill="none" stroke="#0284c7" stroke-width="1"/>
    <text x="17" y="13" fill="#f8fafc" font-family="'Times New Roman', serif" font-size="8">TOP</text>
    <text x="5" y="27" fill="#f8fafc" font-family="'Times New Roman', serif" font-size="8">FRONT</text>
    <text x="25" y="27" fill="#f8fafc" font-family="'Times New Roman', serif" font-size="8">RIGHT</text>
  </g>

  <!-- Central Engineering Geometry -->
  
  <g transform="translate(300, 200)">
    <!-- Structural Legs & Ground Anchor -->
    <line x1="-150" y1="80" x2="150" y2="80" stroke="#334155" stroke-width="1.5" stroke-dasharray="5 3"/>

    <!-- Support Uprights -->
    <line x1="-120" y1="20" x2="-120" y2="80" stroke="#38bdf8" stroke-width="3"/>
    <line x1="-40" y1="20" x2="-40" y2="80" stroke="#38bdf8" stroke-width="3"/>
    <line x1="40" y1="20" x2="40" y2="80" stroke="#38bdf8" stroke-width="3"/>
    <line x1="120" y1="20" x2="120" y2="80" stroke="#38bdf8" stroke-width="3"/>

    <!-- Cross Bracing -->
    <line x1="-120" y1="70" x2="120" y2="70" stroke="#0ea5e9" stroke-width="1.5"/>
    <line x1="-120" y1="30" x2="-40" y2="70" stroke="#64748b" stroke-width="1"/>
    <line x1="-40" y1="30" x2="-120" y2="70" stroke="#64748b" stroke-width="1"/>
    <line x1="40" y1="30" x2="120" y2="70" stroke="#64748b" stroke-width="1"/>
    <line x1="120" y1="30" x2="40" y2="70" stroke="#64748b" stroke-width="1"/>

    <!-- Continuous Belt Deck Bed -->
    <rect x="-140" y="10" width="280" height="15" rx="3" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="-135" cy="17" r="7" fill="none" stroke="#f8fafc" stroke-width="1.5"/>
    <circle cx="135" cy="17" r="7" fill="none" stroke="#f8fafc" stroke-width="1.5"/>

    <!-- Conveyed Item Packages -->
    <rect x="-110" y="-8" width="25" height="18" fill="none" stroke="#10b981" stroke-width="1.5"/>
    <rect x="-30" y="-8" width="25" height="18" fill="none" stroke="#10b981" stroke-width="1.5"/>
    <rect x="90" y="-8" width="25" height="18" fill="none" stroke="#10b981" stroke-width="1.5"/>

    <!-- Enclosed Processing / Inspection Chamber Hood -->
    <polygon points="-50,10 -50,-55 50,-55 50,10" fill="none" stroke="#f8fafc" stroke-width="2"/>
    <rect x="-42" y="-45" width="84" height="40" rx="3" fill="none" stroke="#38bdf8" stroke-dasharray="4 2" stroke-width="1"/>
    <!-- Sensor & Vision Beam -->
    <circle cx="0" cy="-45" r="4" fill="#ef4444"/>
    <line x1="0" y1="-41" x2="0" y2="-5" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="2 2"/>
    
    <!-- Drive Motor & Gearbox Flange -->
    <rect x="125" y="22" width="22" height="30" rx="2" fill="none" stroke="#0ea5e9" stroke-width="1.5"/>
    <line x1="135" y1="17" x2="135" y2="25" stroke="#38bdf8" stroke-width="2"/>
  </g>


  <!-- Lower Engineering Status Bar -->
  <rect x="28" y="328" width="544" height="24" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <circle cx="42" cy="340" r="4" fill="#10b981"/>
  <text x="52" y="343" fill="#94a3b8" font-family="'Times New Roman', serif" font-size="9">SOLIDWORKS 3D MODEL &amp; ASSEMBLY ACTIVE | VERIFIED COMPONENT TOLERANCES</text>
  <text x="460" y="343" fill="#38bdf8" font-family="'Times New Roman', serif" font-size="9" font-weight="bold">SCALE 1:1 [METRIC]</text>
</svg>